[package]
edition = "2024"
name = "esp32-flagship"
rust-version = "1.95"
version = "0.1.0"
description = "ESP32 Flagship Project - Kết hợp tất cả tính năng: Async/Embassy, WiFi/BLE, Deep Sleep, Touch, PWM, CLI Shell, Web Server, OTA"

[[bin]]
name = "esp32-flagship"
path = "./src/bin/main.rs"

[dependencies]
# Core HAL
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.1", features = [
    "esp-alloc",
    "esp32",
    "unstable",
    "wifi",
] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = "0.8.0"
esp-hal-dhcp-server = "0.4.0"
esp-wifi-sys-esp32 = "0.3.0"

# Logging
log = "0.4.20"
esp-backtrace = { version = "0.20.0", features = ["esp32", "println"] }

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
codegen-units = 1
debug = 2
lto = 'fat'
opt-level = 's'

[workspace]
# For future multi-crate split